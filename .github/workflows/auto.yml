name: Kingshot Auto Redeem

on:
  schedule:
    # Runs automatically every 15 minutes 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  redeem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Redeemer Script
        run: python main.py
