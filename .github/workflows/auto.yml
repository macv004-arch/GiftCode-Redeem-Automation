name: Kingshot Auto Redeem

on:
  schedule:
    # Runs automatically every 3 hours in the cloud 24/7
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger button

jobs:
  redeem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable chromium-chromedriver

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt || pip install requests selenium webdriver-manager

      - name: Run Redeemer Script
        run: python main.py
